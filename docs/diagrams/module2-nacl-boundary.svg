<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 372" width="940" height="372"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1A1726"
     role="img" aria-label="Before and after. Before Net-M2, all four subnets sit on the VPC default network ACL, which ships rule 100 allow-all in both directions. After, only the two public subnets are associated with the new net-m2 ACL carrying denies in band 10 to 99 and allows from 100; the two private subnets stay on the default. A VPC flow log writes to its own CloudWatch log group at seven days retention.">
  <style>
    .mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, 'SF Mono', Menlo, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #141221; }
      .tx   { fill: #EEEBF7; }
      .dim  { fill: #ACA4C6; }
      .faint{ fill: #7E7698; }
      .box  { fill: #241F3A; stroke: #463E68; }
      .pub  { fill: #1E2A14; stroke: #9BC63B; }
      .publ { fill: #9BC63B; }
      .prv  { fill: #112A2E; stroke: #2CC4CE; }
      .prvl { fill: #2CC4CE; }
      .tsec { fill: #FF5C70; }
      .secl { fill: #FF5C70; }
      .rail { stroke: #FF5C70; }
      .tmgt { fill: #FF4D9A; }
      .edge { stroke: #7E7698; }
      .edgf { stroke: #ACA4C6; }
    }
  </style>

  <rect class="bg" width="940" height="372" fill="#FBFAFD"/>

  <defs>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5B5570"/>
    </marker>
  </defs>

  <!-- ===================== BEFORE ===================== -->
  <text class="tx" x="20" y="20" font-size="14" font-weight="650" fill="#1A1726">Before · E0 baseline</text>
  <text class="faint mono" x="20" y="38" font-size="10" fill="#8B84A0">acl-0658583ca356c81f9 — the VPC default</text>

  <rect class="box" x="20" y="52" width="380" height="296" rx="9" fill="#F4F2F8" stroke="#CFC8E0" stroke-width="1.2"/>

  <g transform="translate(40,70)">
    <rect class="tsec" width="34" height="34" rx="7" fill="#DD344C"/>
    <path d="M9 12 L25 12 M9 17 L25 17 M9 22 L25 22" stroke="#fff" stroke-width="2"/>
  </g>
  <text class="dim" x="84" y="84" font-size="11.5" fill="#5B5570">default network ACL</text>
  <text class="faint mono" x="84" y="98" font-size="10" fill="#8B84A0">100 allow all · 32767 deny</text>

  <line class="edge" x1="40" y1="120" x2="380" y2="120" stroke="#8B84A0" stroke-width="1.2" stroke-dasharray="3 3"/>

  <rect class="pub" x="40" y="136" width="160" height="44" rx="5" fill="#F2F8E9" stroke="#4F8A10" stroke-width="1.3"/>
  <text class="publ mono" x="120" y="163" text-anchor="middle" font-size="11" fill="#4F8A10">10.0.0.0/24</text>
  <rect class="pub" x="216" y="136" width="160" height="44" rx="5" fill="#F2F8E9" stroke="#4F8A10" stroke-width="1.3"/>
  <text class="publ mono" x="296" y="163" text-anchor="middle" font-size="11" fill="#4F8A10">10.0.1.0/24</text>
  <rect class="prv" x="40" y="192" width="160" height="44" rx="5" fill="#E8F6F7" stroke="#00808A" stroke-width="1.3"/>
  <text class="prvl mono" x="120" y="219" text-anchor="middle" font-size="11" fill="#00808A">10.0.2.0/24</text>
  <rect class="prv" x="216" y="192" width="160" height="44" rx="5" fill="#E8F6F7" stroke="#00808A" stroke-width="1.3"/>
  <text class="prvl mono" x="296" y="219" text-anchor="middle" font-size="11" fill="#00808A">10.0.3.0/24</text>

  <text class="faint mono" x="40" y="266" font-size="10" fill="#8B84A0">All four associated. An allow-all already</text>
  <text class="faint mono" x="40" y="280" font-size="10" fill="#8B84A0">sitting at 100 means nothing below it is</text>
  <text class="faint mono" x="40" y="294" font-size="10" fill="#8B84A0">ever dead letter, and egress is never</text>
  <text class="faint mono" x="40" y="308" font-size="10" fill="#8B84A0">closed — the two failures the SAA-C03 lab</text>
  <text class="faint mono" x="40" y="322" font-size="10" fill="#8B84A0">cannot reach.</text>

  <!-- the transition -->
  <line class="edgf" x1="412" y1="200" x2="508" y2="200" stroke="#5B5570" stroke-width="1.6" marker-end="url(#arb)"/>
  <text class="dim mono" x="460" y="190" text-anchor="middle" font-size="10.5" fill="#5B5570">cdk deploy Net-M2</text>
  <text class="dim mono" x="460" y="218" text-anchor="middle" font-size="10.5" fill="#5B5570">replaces, never layers</text>

  <!-- ===================== AFTER ===================== -->
  <text class="tx" x="520" y="20" font-size="14" font-weight="650" fill="#1A1726">After · E3 deployed</text>
  <text class="faint mono" x="520" y="38" font-size="10" fill="#8B84A0">acl-09e600e410924d679 — built from scratch</text>

  <rect class="box" x="520" y="52" width="400" height="296" rx="9" fill="#F4F2F8" stroke="#CFC8E0" stroke-width="1.2"/>

  <g transform="translate(540,70)">
    <rect class="tsec" width="34" height="34" rx="7" fill="#DD344C"/>
    <path d="M9 12 L25 12 M9 17 L25 17 M9 22 L25 22" stroke="#fff" stroke-width="2"/>
  </g>
  <text class="dim" x="584" y="84" font-size="11.5" fill="#5B5570">net-m2 network ACL</text>
  <text class="faint mono" x="584" y="98" font-size="10" fill="#8B84A0">deny 10–99 · allow 100+10 · deny 32767</text>

  <!-- the rail: it reaches the public row only -->
  <path class="rail" d="M540 126 L540 182" fill="none" stroke="#DD344C" stroke-width="2.6"/>
  <line class="edge" x1="540" y1="126" x2="900" y2="126" stroke="#8B84A0" stroke-width="1.2" stroke-dasharray="3 3"/>

  <rect class="pub" x="556" y="136" width="166" height="44" rx="5" fill="#F2F8E9" stroke="#4F8A10" stroke-width="1.3"/>
  <text class="publ mono" x="639" y="157" text-anchor="middle" font-size="11" fill="#4F8A10">10.0.0.0/24</text>
  <text class="faint mono" x="639" y="172" text-anchor="middle" font-size="10" fill="#8B84A0">moved</text>
  <rect class="pub" x="738" y="136" width="166" height="44" rx="5" fill="#F2F8E9" stroke="#4F8A10" stroke-width="1.3"/>
  <text class="publ mono" x="821" y="157" text-anchor="middle" font-size="11" fill="#4F8A10">10.0.1.0/24</text>
  <text class="faint mono" x="821" y="172" text-anchor="middle" font-size="10" fill="#8B84A0">moved</text>

  <rect class="prv" x="556" y="192" width="166" height="44" rx="5" fill="#E8F6F7" stroke="#00808A" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text class="prvl mono" x="639" y="213" text-anchor="middle" font-size="11" fill="#00808A">10.0.2.0/24</text>
  <text class="faint mono" x="639" y="228" text-anchor="middle" font-size="10" fill="#8B84A0">still on the default</text>
  <rect class="prv" x="738" y="192" width="166" height="44" rx="5" fill="#E8F6F7" stroke="#00808A" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text class="prvl mono" x="821" y="213" text-anchor="middle" font-size="11" fill="#00808A">10.0.3.0/24</text>
  <text class="faint mono" x="821" y="228" text-anchor="middle" font-size="10" fill="#8B84A0">still on the default</text>

  <!-- the flow log -->
  <g transform="translate(540,258)">
    <rect class="tmgt" width="34" height="34" rx="7" fill="#E7157B"/>
    <rect x="9" y="8" width="16" height="19" rx="2" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M13 14 L21 14 M13 18 L21 18 M13 22 L18 22" stroke="#fff" stroke-width="1.5"/>
  </g>
  <text class="dim" x="584" y="272" font-size="11.5" fill="#5B5570">VPC flow log → its own log group</text>
  <text class="faint mono" x="584" y="286" font-size="10" fill="#8B84A0">ALL · 60s · 7 days · DESTROY</text>
  <text class="faint mono" x="540" y="316" font-size="10" fill="#8B84A0">Scoped to Net-M2, not to the VPC's stack —</text>
  <text class="faint mono" x="540" y="330" font-size="10" fill="#8B84A0">vpc.addFlowLog() would have orphaned it on</text>
  <text class="faint mono" x="540" y="344" font-size="10" fill="#8B84A0">destroy. The log group dies with the stack.</text>
</svg>
