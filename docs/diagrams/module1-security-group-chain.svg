<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1A1726"
     role="img" aria-label="The security group trust chain: the internet reaches the external load balancer group on TCP 80; that group is the source allowed into the frontend group on 8080; the frontend group is the source allowed into the internal load balancer group on 80; that group is the source allowed into the backend group on 8080. Separately, the Instance Connect endpoint group is allowed into both compute groups on TCP 22. Egress is open on every group.">
  <style>
    .mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, 'SF Mono', Menlo, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #141221; }
      .tx   { fill: #EEEBF7; }
      .dim  { fill: #ACA4C6; }
      .faint{ fill: #7E7698; }
      .box  { fill: #241F3A; stroke: #463E68; }
      .cap  { fill: #FF5C70; }
      .ok   { stroke: #9BC63B; }
      .okf  { fill: #9BC63B; }
      .edge { stroke: #7E7698; }
    }
  </style>

  <rect class="bg" width="940" height="300" fill="#FBFAFD"/>

  <defs>
    <marker id="aok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4F8A10"/>
    </marker>
    <marker id="adim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8B84A0"/>
    </marker>
  </defs>

  <!-- internet -->
  <g transform="translate(16,74)">
    <rect class="box" width="104" height="60" rx="8" fill="#F4F2F8" stroke="#CFC8E0" stroke-width="1.2"/>
    <text class="tx" x="52" y="27" text-anchor="middle" font-size="12.5" fill="#1A1726">internet</text>
    <text class="faint mono" x="52" y="44" text-anchor="middle" font-size="10" fill="#8B84A0">0.0.0.0/0</text>
  </g>

  <!-- externalAlb -->
  <g transform="translate(168,66)">
    <rect class="box" width="152" height="76" rx="8" fill="#F4F2F8" stroke="#CFC8E0" stroke-width="1.2"/>
    <rect class="cap" width="152" height="3" rx="1.5" fill="#DD344C"/>
    <text class="tx" x="76" y="28" text-anchor="middle" font-size="12.5" fill="#1A1726">externalAlb</text>
    <text class="faint mono" x="76" y="45" text-anchor="middle" font-size="10" fill="#8B84A0">public subnets</text>
    <text class="faint mono" x="76" y="60" text-anchor="middle" font-size="10" fill="#8B84A0">listener :80</text>
  </g>

  <!-- frontend -->
  <g transform="translate(368,66)">
    <rect class="box" width="152" height="76" rx="8" fill="#F4F2F8" stroke="#CFC8E0" stroke-width="1.2"/>
    <rect class="cap" width="152" height="3" rx="1.5" fill="#DD344C"/>
    <text class="tx" x="76" y="28" text-anchor="middle" font-size="12.5" fill="#1A1726">frontend</text>
    <text class="faint mono" x="76" y="45" text-anchor="middle" font-size="10" fill="#8B84A0">private · web tier</text>
    <text class="faint mono" x="76" y="60" text-anchor="middle" font-size="10" fill="#8B84A0">:8080</text>
  </g>

  <!-- internalAlb -->
  <g transform="translate(568,66)">
    <rect class="box" width="152" height="76" rx="8" fill="#F4F2F8" stroke="#CFC8E0" stroke-width="1.2"/>
    <rect class="cap" width="152" height="3" rx="1.5" fill="#DD344C"/>
    <text class="tx" x="76" y="28" text-anchor="middle" font-size="12.5" fill="#1A1726">internalAlb</text>
    <text class="faint mono" x="76" y="45" text-anchor="middle" font-size="10" fill="#8B84A0">private · internal</text>
    <text class="faint mono" x="76" y="60" text-anchor="middle" font-size="10" fill="#8B84A0">listener :80</text>
  </g>

  <!-- backend -->
  <g transform="translate(768,66)">
    <rect class="box" width="152" height="76" rx="8" fill="#F4F2F8" stroke="#CFC8E0" stroke-width="1.2"/>
    <rect class="cap" width="152" height="3" rx="1.5" fill="#DD344C"/>
    <text class="tx" x="76" y="28" text-anchor="middle" font-size="12.5" fill="#1A1726">backend</text>
    <text class="faint mono" x="76" y="45" text-anchor="middle" font-size="10" fill="#8B84A0">private · app tier</text>
    <text class="faint mono" x="76" y="60" text-anchor="middle" font-size="10" fill="#8B84A0">:8080</text>
  </g>

  <!-- the allow hops -->
  <line class="ok" x1="122" y1="104" x2="164" y2="104" stroke="#4F8A10" stroke-width="1.8" marker-end="url(#aok)"/>
  <text class="okf mono" x="143" y="95" text-anchor="middle" font-size="10.5" fill="#4F8A10">tcp 80</text>

  <line class="ok" x1="322" y1="104" x2="364" y2="104" stroke="#4F8A10" stroke-width="1.8" marker-end="url(#aok)"/>
  <text class="okf mono" x="343" y="95" text-anchor="middle" font-size="10.5" fill="#4F8A10">8080</text>

  <line class="ok" x1="522" y1="104" x2="564" y2="104" stroke="#4F8A10" stroke-width="1.8" marker-end="url(#aok)"/>
  <text class="okf mono" x="543" y="95" text-anchor="middle" font-size="10.5" fill="#4F8A10">80</text>

  <line class="ok" x1="722" y1="104" x2="764" y2="104" stroke="#4F8A10" stroke-width="1.8" marker-end="url(#aok)"/>
  <text class="okf mono" x="743" y="95" text-anchor="middle" font-size="10.5" fill="#4F8A10">8080</text>

  <!-- what each rule names as its source: the point of the figure -->
  <text class="faint mono" x="196" y="166" font-size="10" fill="#8B84A0">source = anyIpv4</text>
  <text class="faint mono" x="396" y="166" font-size="10" fill="#8B84A0">source = externalAlb</text>
  <text class="faint mono" x="596" y="166" font-size="10" fill="#8B84A0">source = frontend</text>
  <text class="faint mono" x="796" y="166" font-size="10" fill="#8B84A0">source = internalAlb</text>

  <!-- the Instance Connect side channel -->
  <g transform="translate(368,216)">
    <rect class="box" width="152" height="60" rx="8" fill="#F4F2F8" stroke="#CFC8E0" stroke-width="1.2"/>
    <text class="tx" x="76" y="26" text-anchor="middle" font-size="12.5" fill="#1A1726">eice</text>
    <text class="faint mono" x="76" y="43" text-anchor="middle" font-size="10" fill="#8B84A0">Instance Connect</text>
  </g>
  <path class="edge" d="M444 216 L444 142" fill="none" stroke="#8B84A0" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#adim)"/>
  <text class="dim mono" x="452" y="186" font-size="10.5" fill="#5B5570">tcp 22</text>
  <path class="edge" d="M520 246 L844 246 L844 142" fill="none" stroke="#8B84A0" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#adim)"/>
  <text class="dim mono" x="700" y="240" font-size="10.5" fill="#5B5570">tcp 22 · no bastion, no public IP</text>

  <text class="faint mono" x="16" y="196" font-size="10" fill="#8B84A0">egress: allowAllOutbound on every group —</text>
  <text class="faint mono" x="16" y="210" font-size="10" fill="#8B84A0">ingress-only is the decision (ADR-0016)</text>
</svg>
