<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 568" width="940" height="568"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#1A1726"
     role="img" aria-label="Net-M1 topology: a VPC on 10.0.0.0/16 spanning two availability zones, each with one public and one private slash-24 subnet. The internet gateway sits above the VPC. Public subnets hold the internet-facing load balancer nodes and, in zone a only, the single NAT gateway. Private subnets hold the internal load balancer and the two EC2 tiers. An S3 gateway endpoint attaches to the private route.">
  <style>
    .mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, 'SF Mono', Menlo, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #141221; }
      .tx   { fill: #EEEBF7; }
      .dim  { fill: #ACA4C6; }
      .faint{ fill: #7E7698; }
      .vpc  { fill: #1A1630; stroke: #A77CFF; }
      .vpcl { fill: #A77CFF; }
      .az   { stroke: #463E68; }
      .pub  { fill: #1E2A14; stroke: #9BC63B; }
      .publ { fill: #9BC63B; }
      .prv  { fill: #112A2E; stroke: #2CC4CE; }
      .prvl { fill: #2CC4CE; }
      .tnet { fill: #A77CFF; }
      .tcmp { fill: #FF8C1A; }
      .tsto { fill: #9BC63B; }
      .edge { stroke: #7E7698; }
      .edgf { stroke: #ACA4C6; }
      .head { fill: #A77CFF; }
    }
  </style>

  <rect class="bg" width="940" height="568" fill="#FBFAFD"/>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8B84A0"/>
    </marker>
  </defs>

  <!-- internet -->
  <text class="tx" x="470" y="22" text-anchor="middle" font-size="14" font-weight="650" fill="#1A1726">the internet</text>
  <line class="edgf" x1="470" y1="32" x2="470" y2="52" stroke="#5B5570" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- internet gateway, on the VPC boundary -->
  <g transform="translate(453,56)">
    <rect class="tnet" width="34" height="34" rx="7" fill="#8C4FFF"/>
    <path d="M11 17 L23 17" stroke="#fff" stroke-width="2"/>
    <path d="M14 11 L8 17 L14 23 z" fill="#fff"/>
    <path d="M20 11 L26 17 L20 23 z" fill="#fff"/>
  </g>
  <text class="dim" x="497" y="70" font-size="11.5" fill="#5B5570">Internet gateway</text>
  <text class="faint mono" x="497" y="84" font-size="10" fill="#8B84A0">default route for the public group</text>

  <!-- VPC -->
  <rect class="vpc" x="20" y="106" width="900" height="442" rx="10" fill="#FAF7FF" stroke="#8C4FFF" stroke-width="1.6"/>
  <text class="vpcl mono" x="38" y="130" font-size="11.5" fill="#8C4FFF" letter-spacing="0.04em">VPC · 10.0.0.0/16</text>
  <text class="faint mono" x="190" y="130" font-size="10" fill="#8B84A0">maxAzs 2 · subnetCidrMask 24 · natGateways 1</text>

  <!-- availability zones -->
  <rect class="az" x="42" y="146" width="422" height="382" rx="7" fill="none" stroke="#CFC8E0" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="faint mono" x="58" y="166" font-size="11" fill="#8B84A0" letter-spacing="0.06em">AVAILABILITY ZONE A</text>
  <rect class="az" x="476" y="146" width="422" height="382" rx="7" fill="none" stroke="#CFC8E0" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="faint mono" x="492" y="166" font-size="11" fill="#8B84A0" letter-spacing="0.06em">AVAILABILITY ZONE B</text>

  <!-- public subnet, zone a -->
  <rect class="pub" x="60" y="180" width="386" height="128" rx="6" fill="#F2F8E9" stroke="#4F8A10" stroke-width="1.3"/>
  <text class="publ mono" x="76" y="201" font-size="11.5" fill="#4F8A10">public · 10.0.0.0/24</text>
  <g transform="translate(84,216)">
    <rect class="tnet" width="34" height="34" rx="7" fill="#8C4FFF"/>
    <circle cx="17" cy="11" r="3.4" fill="#fff"/>
    <circle cx="9" cy="24" r="3" fill="#fff"/>
    <circle cx="25" cy="24" r="3" fill="#fff"/>
    <path d="M17 14 L9 21 M17 14 L25 21" stroke="#fff" stroke-width="1.6" fill="none"/>
  </g>
  <text class="dim" x="84" y="268" font-size="11.5" fill="#5B5570">ALB node</text>
  <text class="faint mono" x="84" y="282" font-size="10" fill="#8B84A0">10.0.0.242 · HTTP 80</text>

  <g transform="translate(286,216)">
    <rect class="tnet" width="34" height="34" rx="7" fill="#8C4FFF"/>
    <path d="M8 22 L17 10 L26 22" stroke="#fff" stroke-width="2" fill="none"/>
    <path d="M17 10 L17 25" stroke="#fff" stroke-width="2"/>
  </g>
  <text class="dim" x="286" y="268" font-size="11.5" fill="#5B5570">NAT gateway</text>
  <text class="faint mono" x="286" y="282" font-size="10" fill="#8B84A0">the only one · ~$32.85/mo</text>

  <!-- public subnet, zone b -->
  <rect class="pub" x="494" y="180" width="386" height="128" rx="6" fill="#F2F8E9" stroke="#4F8A10" stroke-width="1.3"/>
  <text class="publ mono" x="510" y="201" font-size="11.5" fill="#4F8A10">public · 10.0.1.0/24</text>
  <g transform="translate(518,216)">
    <rect class="tnet" width="34" height="34" rx="7" fill="#8C4FFF"/>
    <circle cx="17" cy="11" r="3.4" fill="#fff"/>
    <circle cx="9" cy="24" r="3" fill="#fff"/>
    <circle cx="25" cy="24" r="3" fill="#fff"/>
    <path d="M17 14 L9 21 M17 14 L25 21" stroke="#fff" stroke-width="1.6" fill="none"/>
  </g>
  <text class="dim" x="518" y="268" font-size="11.5" fill="#5B5570">ALB node</text>
  <text class="faint mono" x="518" y="282" font-size="10" fill="#8B84A0">10.0.1.110 · HTTP 80</text>

  <text class="faint mono" x="700" y="238" font-size="10" fill="#8B84A0">no NAT gateway here —</text>
  <text class="faint mono" x="700" y="252" font-size="10" fill="#8B84A0">zone b egresses across the</text>
  <text class="faint mono" x="700" y="266" font-size="10" fill="#8B84A0">AZ boundary (ADR-0006)</text>

  <!-- public default routes toward the internet gateway -->
  <line class="edge" x1="253" y1="180" x2="253" y2="98" stroke="#8B84A0" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line class="edge" x1="687" y1="180" x2="687" y2="98" stroke="#8B84A0" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line class="edge" x1="253" y1="98" x2="451" y2="98" stroke="#8B84A0" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line class="edge" x1="687" y1="98" x2="489" y2="98" stroke="#8B84A0" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text class="dim mono" x="262" y="152" font-size="10.5" fill="#5B5570">0.0.0.0/0</text>

  <!-- private subnet, zone a -->
  <rect class="prv" x="60" y="356" width="386" height="152" rx="6" fill="#E8F6F7" stroke="#00808A" stroke-width="1.3"/>
  <text class="prvl mono" x="76" y="377" font-size="11.5" fill="#00808A">private · 10.0.2.0/24</text>
  <g transform="translate(84,392)">
    <rect class="tcmp" width="34" height="34" rx="7" fill="#ED7100"/>
    <rect x="8" y="8" width="18" height="18" rx="2.5" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M13 13 L21 13 M13 17 L21 17 M13 21 L18 21" stroke="#fff" stroke-width="1.5"/>
  </g>
  <text class="dim" x="84" y="444" font-size="11.5" fill="#5B5570">frontend · t3.micro</text>
  <text class="faint mono" x="84" y="458" font-size="10" fill="#8B84A0">10.0.2.198 · :8080</text>

  <g transform="translate(286,392)">
    <rect class="tnet" width="34" height="34" rx="7" fill="#8C4FFF"/>
    <circle cx="17" cy="11" r="3.4" fill="#fff"/>
    <circle cx="9" cy="24" r="3" fill="#fff"/>
    <circle cx="25" cy="24" r="3" fill="#fff"/>
    <path d="M17 14 L9 21 M17 14 L25 21" stroke="#fff" stroke-width="1.6" fill="none"/>
  </g>
  <text class="dim" x="286" y="444" font-size="11.5" fill="#5B5570">internal ALB</text>
  <text class="faint mono" x="286" y="458" font-size="10" fill="#8B84A0">:80 · not internet-facing</text>

  <!-- private subnet, zone b -->
  <rect class="prv" x="494" y="356" width="386" height="152" rx="6" fill="#E8F6F7" stroke="#00808A" stroke-width="1.3"/>
  <text class="prvl mono" x="510" y="377" font-size="11.5" fill="#00808A">private · 10.0.3.0/24</text>
  <g transform="translate(518,392)">
    <rect class="tcmp" width="34" height="34" rx="7" fill="#ED7100"/>
    <rect x="8" y="8" width="18" height="18" rx="2.5" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M13 13 L21 13 M13 17 L21 17 M13 21 L18 21" stroke="#fff" stroke-width="1.5"/>
  </g>
  <text class="dim" x="518" y="444" font-size="11.5" fill="#5B5570">backend · t3.micro</text>
  <text class="faint mono" x="518" y="458" font-size="10" fill="#8B84A0">:8080</text>

  <g transform="translate(720,392)">
    <rect class="tsto" width="34" height="34" rx="7" fill="#7AA116"/>
    <path d="M9 10 L25 10 L22 25 L12 25 z" fill="none" stroke="#fff" stroke-width="2"/>
  </g>
  <text class="dim" x="720" y="444" font-size="11.5" fill="#5B5570">S3 gateway endpoint</text>
  <text class="faint mono" x="720" y="458" font-size="10" fill="#8B84A0">free · no NAT charge</text>

  <!-- private default route toward the NAT gateway -->
  <line class="edge" x1="150" y1="356" x2="150" y2="332" stroke="#8B84A0" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line class="edge" x1="150" y1="332" x2="303" y2="332" stroke="#8B84A0" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line class="edge" x1="303" y1="332" x2="303" y2="310" stroke="#8B84A0" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <line class="edge" x1="584" y1="356" x2="584" y2="332" stroke="#8B84A0" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line class="edge" x1="584" y1="332" x2="310" y2="332" stroke="#8B84A0" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text class="dim mono" x="330" y="348" font-size="10.5" fill="#5B5570">0.0.0.0/0 → NAT</text>
</svg>
